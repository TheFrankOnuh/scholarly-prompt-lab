name: Tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: for f in app.js checks.js data.js theories.js theory-links.js disciplines.js procedures.js community.js report.js tour.js offline.js sw.js tools/proposal.mjs; do node --check "$f"; done
      - name: Run tests
        run: node --test tests/checks.test.js tests/data.test.js tests/review.test.js
