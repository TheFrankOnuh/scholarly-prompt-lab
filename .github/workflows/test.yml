name: Tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: for f in locales.js i18n.js release.js app.js ui.js checks.js data.js theories.js theory-links.js disciplines.js procedures.js community.js report.js tour.js projects.js protocol.js conversations.js teaching-uc003.js offline.js counter.js sw.js tools/proposal.mjs tools/set-version.mjs tools/protocol-docs.mjs tools/build-uc003.mjs; do node --check "$f"; done
      - name: Documentation matches the protocol
        run: node tools/protocol-docs.mjs --check
      - name: Run tests
        run: node --test tests/checks.test.js tests/data.test.js tests/review.test.js tests/version.test.js tests/projects.test.js tests/counter.test.js tests/report.test.js tests/protocol.test.js tests/conversations.test.js
